<!DOCTYPE html>
<html lang="{{ 'kk' if lang == 'kk' else 'ru' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t('title.default') }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menu.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% if request.endpoint != 'index' %}<div class="wm" aria-hidden="true"></div>{% endif %}
    <aside class="rail">
        <a href="{{ url_for('index') }}" class="rail-logo" aria-label="JTU">
            <svg class="emblem" viewBox="0 0 48 40" aria-hidden="true">
                <defs>
                    <linearGradient id="eg1" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#ffffff"/>
                        <stop offset="1" stop-color="#ffc9d1"/>
                    </linearGradient>
                    <linearGradient id="eg2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#ffe9ec"/>
                        <stop offset="1" stop-color="#ff9aa9"/>
                    </linearGradient>
                </defs>
                <ellipse cx="24" cy="24" rx="20" ry="8.5" transform="rotate(-14 24 24)" fill="none" stroke="url(#eg2)" stroke-width="2.4" opacity=".9"/>
                <path d="M13 17v8l11 4.5 11-4.5v-8l-11 4.5z" fill="#7a0c1e" opacity=".55" transform="translate(0 1.6)"/>
                <path d="M13 17v8l11 4.5 11-4.5v-8l-11 4.5z" fill="url(#eg2)"/>
                <path d="M3 15.5 24 6l21 9.5L24 25z" fill="url(#eg1)"/>
                <path d="M24 25 45 15.5v2L24 27z" fill="#e8a0ad"/>
                <path d="M3 15.5v2L24 27v-2z" fill="#f5c3cb"/>
                <path d="M40 17v10" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
                <circle cx="40" cy="29" r="2" fill="#fff"/>
            </svg>
            <span class="logo-text">JTU</span>
        </a>

        <nav class="rail-nav">
            <a href="{{ url_for('index') }}" class="rail-item {{ 'active' if request.endpoint == 'index' }}" aria-label="{{ t('nav.home') }}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
                <span class="rail-label">{{ t('nav.home') }}</span>
            </a>
            <a href="{{ url_for('analyze') }}" class="rail-item {{ 'active' if request.endpoint == 'analyze' }}" aria-label="{{ t('nav.journal') }}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5c3-1.5 6-1.5 10 1 4-2.5 7-2.5 10-1v14c-3-1.5-6-1.5-10 1-4-2.5-7-2.5-10-1z"/><path d="M12 6v14"/></svg>
                <span class="rail-label">{{ t('nav.journal') }}</span>
            </a>
            <a href="{{ url_for('table') }}" class="rail-item {{ 'active' if request.endpoint == 'table' }}" aria-label="{{ t('nav.exam') }}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>
                <span class="rail-label">{{ t('nav.exam') }}</span>
            </a>
            <a href="{{ url_for('gpa') }}" class="rail-item {{ 'active' if request.endpoint == 'gpa' }}" aria-label="{{ t('nav.gpa') }}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2M16 12h0M16 16h0"/></svg>
                <span class="rail-label">{{ t('nav.gpa') }}</span>
            </a>
            <a href="{{ url_for('help_page') }}" class="rail-item {{ 'active' if request.endpoint == 'help_page' }}" aria-label="{{ t('nav.help') }}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>
                <span class="rail-label">{{ t('nav.help') }}</span>
            </a>
        </nav>

        <div class="rail-lang">
            <a href="?lang=ru" class="{{ 'active' if lang == 'ru' }}">РУС</a>
            <a href="?lang=kk" class="{{ 'active' if lang == 'kk' }}">ҚАЗ</a>
        </div>
    </aside>

    <div class="shell">
        {% block content %}{% endblock %}

        <footer class="footer"><img class="footer-logo" src="{{ url_for('static', filename='img/aues_logo_red.png') }}" alt="Energo University"><span>{{ t('footer') }}</span></footer>
    </div>
</body>
</html>
